<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - Ceshi Back</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f6f7f9;
        --surface: #ffffff;
        --text: #18202a;
        --muted: #657184;
        --line: #dce2e8;
        --primary: #176247;
        --primary-strong: #0e4b36;
        --error: #b42318;
        --error-soft: #fff1f0;
        --focus: rgba(23, 98, 71, 0.2);
        font-family:
          Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .login-panel {
        width: min(100%, 420px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 34px;
        box-shadow: 0 18px 42px rgba(24, 32, 42, 0.1);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        font-weight: 800;
        font-size: 18px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }

      .intro {
        margin: 10px 0 28px;
        color: var(--muted);
        line-height: 1.65;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 750;
      }

      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        color: var(--text);
        font: inherit;
        background: #fff;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--focus);
        outline: none;
      }

      input[aria-invalid="true"] {
        border-color: var(--error);
      }

      .error {
        min-height: 20px;
        margin-top: 6px;
        color: var(--error);
        font-size: 13px;
        line-height: 1.45;
      }

      .form-error {
        display: none;
        margin: 0 0 18px;
        border: 1px solid #f1b5ae;
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--error-soft);
        color: var(--error);
        font-size: 14px;
        line-height: 1.5;
      }

      .form-error.is-visible {
        display: block;
      }

      button {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--primary);
        border-radius: 6px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      button:hover {
        background: var(--primary-strong);
      }

      button:focus {
        box-shadow: 0 0 0 4px var(--focus);
        outline: none;
      }

      @media (max-width: 480px) {
        .page {
          align-items: start;
          padding: 18px;
        }

        .login-panel {
          padding: 24px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="brand" aria-label="Ceshi Back">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>Ceshi Back</span>
        </div>

        <h1 id="login-title">登录</h1>
        <p class="intro">请输入用户名或邮箱和密码继续访问。</p>

        <form id="login-form" novalidate>
          <p class="form-error" id="form-error" role="alert">
            请填写用户名/邮箱和密码。
          </p>

          <div class="field">
            <label for="account">用户名/邮箱</label>
            <input
              id="account"
              name="account"
              type="text"
              autocomplete="username"
              aria-describedby="account-error"
              aria-invalid="false"
            >
            <div class="error" id="account-error"></div>
          </div>

          <div class="field">
            <label for="password">密码</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              aria-describedby="password-error"
              aria-invalid="false"
            >
            <div class="error" id="password-error"></div>
          </div>

          <button type="submit">登录</button>
        </form>
      </section>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const formError = document.querySelector("#form-error");
      const account = document.querySelector("#account");
      const password = document.querySelector("#password");
      const accountError = document.querySelector("#account-error");
      const passwordError = document.querySelector("#password-error");

      function setFieldError(input, errorNode, message) {
        input.setAttribute("aria-invalid", message ? "true" : "false");
        errorNode.textContent = message;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const accountMessage = account.value.trim() ? "" : "请输入用户名或邮箱。";
        const passwordMessage = password.value.trim() ? "" : "请输入密码。";
        const hasError = Boolean(accountMessage || passwordMessage);

        setFieldError(account, accountError, accountMessage);
        setFieldError(password, passwordError, passwordMessage);
        formError.classList.toggle("is-visible", hasError);

        if (hasError) {
          (accountMessage ? account : password).focus();
        }
      });
    </script>
  </body>
</html>
